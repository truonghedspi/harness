<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Five-agent harness workflow</title>
  <desc id="desc">The human-facing orchestrator owns focused design and planning. Test-agent has design, implementation, and integration phases. Maker implements, checker alone accepts done, and harness-manager repairs the canonical harness.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
      .title { fill:#f8fafc; font-size:20px; font-weight:700; }
      .subtitle { fill:#94a3b8; font-size:11px; }
      .name { fill:#f8fafc; font-size:13px; font-weight:700; }
      .body { fill:#cbd5e1; font-size:10px; }
      .label { fill:#94a3b8; font-size:9px; }
      .lane { fill:none; stroke:#334155; stroke-width:1; stroke-dasharray:7 5; }
      .box { stroke-width:1.5; rx:8; }
      .line { fill:none; stroke:#64748b; stroke-width:1.5; marker-end:url(#arrow); }
      .happy { fill:none; stroke:#22d3ee; stroke-width:1.8; marker-end:url(#arrowCyan); }
    </style>
  </defs>
  <rect width="1200" height="760" fill="#0f172a"/>
  <rect width="1200" height="760" fill="url(#grid)"/>
  <text class="title" x="40" y="44">Harness workflow — five-agent roster</text>
  <text class="subtitle" x="40" y="66">The router selects the next phase; only checker may accept a feature as done.</text>

  <rect class="lane" x="32" y="96" width="1136" height="420" rx="14"/>
  <text x="52" y="120" fill="#fbbf24" font-size="10" font-weight="700">PROJECT DELIVERY LOOP</text>

  <!-- connectors first -->
  <path class="happy" d="M155 220H235"/>
  <path class="happy" d="M405 220H485"/>
  <path class="happy" d="M655 220H735"/>
  <path class="happy" d="M905 220H985"/>
  <path class="line" d="M1075 270V340H320V270"/>
  <path class="line" d="M570 270V340H320V270"/>
  <path class="line" d="M820 270V340H320V270"/>
  <path class="line" d="M1075 270V430H740"/>
  <path class="line" d="M740 430H570"/>
  <path class="line" d="M570 430H405"/>
  <path class="line" d="M405 430H320V270"/>
  <path class="line" d="M485 455V485H655V270"/>

  <!-- human -->
  <rect x="70" y="178" width="170" height="84" rx="42" fill="#0f172a"/>
  <rect x="70" y="178" width="170" height="84" rx="42" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="name" x="155" y="211" text-anchor="middle">human</text>
  <text class="body" x="155" y="232" text-anchor="middle">intent · approval · answers</text>

  <!-- orchestrator -->
  <rect x="235" y="170" width="170" height="100" rx="8" fill="#0f172a"/>
  <rect class="box" x="235" y="170" width="170" height="100" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/>
  <text class="name" x="320" y="201" text-anchor="middle">orchestrator</text>
  <text class="body" x="320" y="222" text-anchor="middle">front door + human-interview</text>
  <text class="body" x="320" y="240" text-anchor="middle">design / planning, bounded context</text>
  <text class="label" x="320" y="257" text-anchor="middle">LAYER: design · decomposition</text>

  <!-- test agent -->
  <rect x="485" y="154" width="170" height="132" rx="8" fill="#0f172a"/>
  <rect class="box" x="485" y="154" width="170" height="132" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text class="name" x="570" y="185" text-anchor="middle">test-agent</text>
  <text class="body" x="570" y="207" text-anchor="middle">test-design: no implementation</text>
  <text class="body" x="570" y="225" text-anchor="middle">test-implement: red + mutant</text>
  <text class="body" x="570" y="243" text-anchor="middle">integration: Level 3 boundary</text>
  <text class="label" x="570" y="263" text-anchor="middle">LAYER: oracle · integration</text>

  <!-- maker -->
  <rect x="735" y="170" width="170" height="100" rx="8" fill="#0f172a"/>
  <rect class="box" x="735" y="170" width="170" height="100" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>
  <text class="name" x="820" y="205" text-anchor="middle">maker</text>
  <text class="body" x="820" y="228" text-anchor="middle">one bounded implementation step</text>
  <text class="label" x="820" y="249" text-anchor="middle">LAYER: implementation</text>

  <!-- checker -->
  <rect x="985" y="170" width="180" height="100" rx="8" fill="#0f172a"/>
  <rect class="box" x="985" y="170" width="180" height="100" fill="rgba(120,53,15,.3)" stroke="#fbbf24"/>
  <text class="name" x="1075" y="205" text-anchor="middle">checker</text>
  <text class="body" x="1075" y="228" text-anchor="middle">final acceptance; falsifies claim</text>
  <text class="label" x="1075" y="249" text-anchor="middle">LAYER: final-acceptance</text>

  <!-- outcomes -->
  <rect x="570" y="394" width="170" height="72" rx="36" fill="#0f172a"/>
  <rect x="570" y="394" width="170" height="72" rx="36" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/>
  <text class="name" x="655" y="425" text-anchor="middle">done</text>
  <text class="body" x="655" y="446" text-anchor="middle">checker APPROVE only</text>
  <text class="label" x="452" y="422" text-anchor="middle">reject / redesign</text>
  <text class="label" x="920" y="323" text-anchor="middle">complete handoff</text>
  <text class="label" x="680" y="480" text-anchor="middle">approve</text>

  <!-- harness manager lane -->
  <rect class="lane" x="32" y="550" width="1136" height="160" rx="14"/>
  <text x="52" y="574" fill="#fb7185" font-size="10" font-weight="700">CANONICAL HARNESS LIFECYCLE</text>
  <path class="line" d="M405 640H520"/>
  <path class="line" d="M690 640H805"/>
  <rect x="180" y="602" width="225" height="76" rx="8" fill="#0f172a"/>
  <rect class="box" x="180" y="602" width="225" height="76" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/>
  <text class="name" x="292" y="633" text-anchor="middle">verify-harness</text>
  <text class="body" x="292" y="654" text-anchor="middle">finding classified layer: harness</text>
  <rect x="520" y="590" width="170" height="100" rx="8" fill="#0f172a"/>
  <rect class="box" x="520" y="590" width="170" height="100" fill="rgba(136,19,55,.4)" stroke="#fb7185"/>
  <text class="name" x="605" y="623" text-anchor="middle">harness-manager</text>
  <text class="body" x="605" y="646" text-anchor="middle">setup + canonical repair</text>
  <text class="body" x="605" y="664" text-anchor="middle">templates / scripts, not target</text>
  <rect x="805" y="602" width="215" height="76" rx="8" fill="#0f172a"/>
  <rect class="box" x="805" y="602" width="215" height="76" fill="rgba(6,78,59,.4)" stroke="#34d399"/>
  <text class="name" x="912" y="633" text-anchor="middle">reverify + upgrade</text>
  <text class="body" x="912" y="654" text-anchor="middle">demo evidence reaches every target</text>
</svg>
