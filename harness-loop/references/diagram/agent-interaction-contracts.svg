<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">Agent interactions and durable handoff contracts</title>
  <desc id="desc">A five-agent harness workflow. The human communicates with the orchestrator. A router dispatches focused phases by reading durable contracts. The test-agent works in test-design, test-implement, or integration mode. The maker hands a digest-bound review packet to the checker, who alone accepts done. The harness-manager repairs canonical harness findings.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="cyanArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="roseArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family:'JetBrains Mono','SF Mono','Cascadia Code',monospace; }
      .title { fill:#f8fafc; font-size:23px; font-weight:700; }
      .subtitle { fill:#94a3b8; font-size:12px; }
      .lane { fill:none; stroke:#334155; stroke-width:1; stroke-dasharray:8 5; }
      .name { fill:#f8fafc; font-size:14px; font-weight:700; }
      .body { fill:#cbd5e1; font-size:10px; }
      .mini { fill:#94a3b8; font-size:9px; }
      .tag { fill:#f8fafc; font-size:9px; font-weight:600; }
      .contractLabel { fill:#e2e8f0; font-size:9px; font-weight:600; }
      .feedbackLabel { fill:#fda4af; font-size:9px; font-weight:600; }
      .code { fill:rgba(8,51,68,.40); stroke:#22d3ee; stroke-width:1.5; }
      .agentO { fill:rgba(8,51,68,.40); stroke:#22d3ee; stroke-width:1.5; }
      .agentT { fill:rgba(6,78,59,.40); stroke:#34d399; stroke-width:1.5; }
      .agentM { fill:rgba(76,29,149,.40); stroke:#a78bfa; stroke-width:1.5; }
      .agentC { fill:rgba(120,53,15,.30); stroke:#fbbf24; stroke-width:1.5; }
      .agentH { fill:rgba(136,19,55,.40); stroke:#fb7185; stroke-width:1.5; }
      .contract { fill:rgba(30,41,59,.70); stroke:#94a3b8; stroke-width:1.25; }
      .dispatch { fill:none; stroke:#22d3ee; stroke-width:1.8; marker-end:url(#cyanArrow); }
      .state { fill:none; stroke:#64748b; stroke-width:1.4; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .return { fill:none; stroke:#fb7185; stroke-width:1.6; marker-end:url(#roseArrow); }
      .normal { fill:none; stroke:#64748b; stroke-width:1.5; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="1680" height="1040" fill="#0f172a"/>
  <rect width="1680" height="1040" fill="url(#grid)"/>
  <text class="title" x="48" y="48">Five-agent workflow — interaction through durable contracts</text>
  <text class="subtitle" x="48" y="72">Solid cyan = router dispatch · dashed slate = a durable read/write contract · rose = rejection or re-plan return.</text>

  <rect class="lane" x="32" y="100" width="1616" height="190" rx="14"/>
  <text x="54" y="124" fill="#fbbf24" font-size="10" font-weight="700">CONTROL PLANE — NO AGENT SELECTS ITS SUCCESSOR</text>

  <!-- control-plane connectors -->
  <path class="normal" d="M268 194H350"/>
  <path class="normal" d="M590 194H690"/>
  <path class="state" d="M470 242V270H470V320"/>
  <path class="state" d="M830 242V270H470"/>
  <path class="state" d="M115 242V270H470"/>

  <!-- human -->
  <rect x="90" y="150" width="178" height="92" rx="46" fill="#0f172a"/>
  <rect class="agentO" x="90" y="150" width="178" height="92" rx="46"/>
  <text class="name" x="179" y="184" text-anchor="middle">human</text>
  <text class="body" x="179" y="206" text-anchor="middle">requirement · answer · approval</text>
  <text class="mini" x="179" y="224" text-anchor="middle">sole authority for human decisions</text>

  <!-- orchestrator -->
  <rect x="350" y="140" width="240" height="104" rx="8" fill="#0f172a"/>
  <rect class="agentO" x="350" y="140" width="240" height="104" rx="8"/>
  <text class="name" x="470" y="174" text-anchor="middle">orchestrator</text>
  <text class="body" x="470" y="197" text-anchor="middle">front door · human-interview</text>
  <text class="body" x="470" y="215" text-anchor="middle">design / plan with bounded context</text>
  <text class="mini" x="470" y="233" text-anchor="middle">never implementation, tests, or status: done</text>

  <!-- router -->
  <rect x="690" y="140" width="280" height="104" rx="8" fill="#0f172a"/>
  <rect class="code" x="690" y="140" width="280" height="104" rx="8"/>
  <text class="name" x="830" y="174" text-anchor="middle">route.mjs + run-loop.mjs</text>
  <text class="body" x="830" y="197" text-anchor="middle">read state → {node, layer, mode, why}</text>
  <text class="body" x="830" y="215" text-anchor="middle">dispatch exactly the selected phase</text>
  <text class="mini" x="830" y="233" text-anchor="middle">the only routing authority</text>
  <text class="tag" x="282" y="184">decision contract: requirement / receipt</text>
  <text class="tag" x="604" y="184">routing request: observe durable state</text>
  <text class="mini" x="480" y="302">human-interview receipt · design approval JSON</text>

  <rect class="lane" x="32" y="320" width="1616" height="488" rx="14"/>
  <text x="54" y="344" fill="#fbbf24" font-size="10" font-weight="700">PROJECT DELIVERY — ROUTER DISPATCHES PHASES; CONTRACTS OUTLIVE A SESSION</text>

  <!-- router dispatches (draw before boxes) -->
  <path class="dispatch" d="M760 244V370H270V408"/>
  <path class="dispatch" d="M830 244V370H650V408"/>
  <path class="dispatch" d="M830 244V370H1030V408"/>
  <path class="dispatch" d="M900 244V370H1410V408"/>
  <text class="tag" x="270" y="392" text-anchor="middle">dispatch contract: design / planning</text>
  <text class="tag" x="650" y="392" text-anchor="middle">dispatch contract: test-design / implement / integration</text>
  <text class="tag" x="1030" y="392" text-anchor="middle">dispatch contract: implementation</text>
  <text class="tag" x="1410" y="392" text-anchor="middle">dispatch contract: final-acceptance</text>

  <!-- return edges -->
  <path class="return" d="M1410 520V570H830V244"/>
  <text class="feedbackLabel" x="1115" y="548">feedback contract: checkerVerdict + checkerNotes</text>
  <text class="feedbackLabel" x="1115" y="563">REJECT / NEEDS DESIGN / NEEDS RE-PLAN → router → selected agent</text>
  <path class="normal" d="M1030 520V570H1410V520"/>
  <text class="contractLabel" x="1160" y="587">review-admission contract: reviewPacket + evidence + readyForCheck</text>

  <!-- agent boxes -->
  <rect x="130" y="408" width="280" height="112" rx="8" fill="#0f172a"/>
  <rect class="agentO" x="130" y="408" width="280" height="112" rx="8"/>
  <text class="name" x="270" y="442" text-anchor="middle">orchestrator</text>
  <text class="body" x="270" y="465" text-anchor="middle">write design + feature plan; clear marker</text>
  <text class="body" x="270" y="483" text-anchor="middle">may spawn a bounded context gatherer</text>
  <text class="mini" x="270" y="503" text-anchor="middle">LAYER: design · decomposition</text>

  <rect x="510" y="408" width="280" height="112" rx="8" fill="#0f172a"/>
  <rect class="agentT" x="510" y="408" width="280" height="112" rx="8"/>
  <text class="name" x="650" y="442" text-anchor="middle">test-agent</text>
  <text class="body" x="650" y="465" text-anchor="middle">design: no implementation access</text>
  <text class="body" x="650" y="483" text-anchor="middle">implement: red-first · integration: Level 3</text>
  <text class="mini" x="650" y="503" text-anchor="middle">LAYER: oracle · integration</text>

  <rect x="890" y="408" width="280" height="112" rx="8" fill="#0f172a"/>
  <rect class="agentM" x="890" y="408" width="280" height="112" rx="8"/>
  <text class="name" x="1030" y="442" text-anchor="middle">maker</text>
  <text class="body" x="1030" y="465" text-anchor="middle">one bounded implementation step</text>
  <text class="body" x="1030" y="483" text-anchor="middle">evidence + reviewPacket; never done</text>
  <text class="mini" x="1030" y="503" text-anchor="middle">LAYER: implementation</text>

  <rect x="1270" y="408" width="280" height="112" rx="8" fill="#0f172a"/>
  <rect class="agentC" x="1270" y="408" width="280" height="112" rx="8"/>
  <text class="name" x="1410" y="442" text-anchor="middle">checker</text>
  <text class="body" x="1410" y="465" text-anchor="middle">falsify final batch; typed verdict</text>
  <text class="body" x="1410" y="483" text-anchor="middle">only writer of status: done</text>
  <text class="mini" x="1410" y="503" text-anchor="middle">LAYER: final-acceptance</text>

  <!-- durable contracts -->
  <path class="state" d="M270 520V628"/>
  <path class="state" d="M650 520V628"/>
  <path class="state" d="M1030 520V628"/>
  <path class="state" d="M1410 520V628"/>
  <path class="state" d="M410 687H510"/>
  <path class="state" d="M790 687H890"/>
  <path class="state" d="M1170 687H1270"/>
  <text class="contractLabel" x="270" y="607" text-anchor="middle">design / plan contract</text>
  <text class="contractLabel" x="650" y="607" text-anchor="middle">oracle contract</text>
  <text class="contractLabel" x="1030" y="607" text-anchor="middle">delivery handoff contract</text>
  <text class="contractLabel" x="1410" y="607" text-anchor="middle">verdict / feedback contract</text>
  <text class="mini" x="460" y="676" text-anchor="middle">router reads eligibility contract</text>
  <text class="mini" x="840" y="676" text-anchor="middle">router reads mutant-proof eligibility</text>
  <text class="mini" x="1220" y="676" text-anchor="middle">router reads batch admission state</text>

  <rect x="100" y="628" width="310" height="118" rx="8" fill="#0f172a"/>
  <rect class="contract" x="100" y="628" width="310" height="118" rx="8"/>
  <text class="name" x="255" y="660" text-anchor="middle">Design + plan contract</text>
  <text class="body" x="255" y="682" text-anchor="middle">design digest · seams · invariants</text>
  <text class="body" x="255" y="700" text-anchor="middle">feature DAG · falsifier · context packet</text>
  <text class="mini" x="255" y="724" text-anchor="middle">docs/design/** · feature_list.json</text>

  <rect x="480" y="628" width="310" height="118" rx="8" fill="#0f172a"/>
  <rect class="contract" x="480" y="628" width="310" height="118" rx="8"/>
  <text class="name" x="635" y="660" text-anchor="middle">Oracle contract</text>
  <text class="body" x="635" y="682" text-anchor="middle">feature-linked TCON conditions</text>
  <text class="body" x="635" y="700" text-anchor="middle">red test + mutant:true failure evidence</text>
  <text class="mini" x="635" y="724" text-anchor="middle">tests/design/** · test source · evidence</text>

  <rect x="860" y="628" width="310" height="118" rx="8" fill="#0f172a"/>
  <rect class="contract" x="860" y="628" width="310" height="118" rx="8"/>
  <text class="name" x="1015" y="660" text-anchor="middle">Delivery handoff contract</text>
  <text class="body" x="1015" y="682" text-anchor="middle">contractDigest · verification · evidence</text>
  <text class="body" x="1015" y="700" text-anchor="middle">reviewPacket + readyForCheck:true</text>
  <text class="mini" x="1015" y="724" text-anchor="middle">passing stays open until acceptance</text>

  <rect x="1240" y="628" width="310" height="118" rx="8" fill="#0f172a"/>
  <rect class="contract" x="1240" y="628" width="310" height="118" rx="8"/>
  <text class="name" x="1395" y="660" text-anchor="middle">Acceptance / return contract</text>
  <text class="body" x="1395" y="682" text-anchor="middle">typed APPROVE or REJECT verdict</text>
  <text class="body" x="1395" y="700" text-anchor="middle">checkerNotes first-line routing marker</text>
  <text class="mini" x="1395" y="724" text-anchor="middle">status: done only on APPROVE</text>

  <!-- harness lifecycle -->
  <rect class="lane" x="32" y="838" width="1616" height="166" rx="14"/>
  <text x="54" y="862" fill="#fb7185" font-size="10" font-weight="700">CANONICAL HARNESS LIFECYCLE — SEPARATE FROM PRODUCT DELIVERY</text>
  <path class="normal" d="M430 930H610"/>
  <path class="normal" d="M900 930H1080"/>
  <rect x="160" y="890" width="270" height="80" rx="8" fill="#0f172a"/>
  <rect class="contract" x="160" y="890" width="270" height="80" rx="8"/>
  <text class="name" x="295" y="922" text-anchor="middle">verify-harness</text>
  <text class="body" x="295" y="945" text-anchor="middle">finding: layer=harness + evidence</text>
  <rect x="610" y="878" width="290" height="104" rx="8" fill="#0f172a"/>
  <rect class="agentH" x="610" y="878" width="290" height="104" rx="8"/>
  <text class="name" x="755" y="912" text-anchor="middle">harness-manager</text>
  <text class="body" x="755" y="935" text-anchor="middle">setup or canonical repair</text>
  <text class="body" x="755" y="953" text-anchor="middle">templates/tree/** · scripts/**, never only target</text>
  <text class="contractLabel" x="520" y="918">issue contract: signature + evidence</text>
  <rect x="1080" y="890" width="300" height="80" rx="8" fill="#0f172a"/>
  <rect class="agentT" x="1080" y="890" width="300" height="80" rx="8"/>
  <text class="name" x="1230" y="922" text-anchor="middle">proof + propagation contract</text>
  <text class="body" x="1230" y="945" text-anchor="middle">demo.sh · reverify · upgrade-context · target upgrade</text>
</svg>
