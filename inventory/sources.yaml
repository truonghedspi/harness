# Sources of truth for inventory extraction. Fill before feat-001.
timesten:
  access: mcp              # agents reach TimesTen through the MCP server below — READ-ONLY
  mcp_server: ""           # MCP server name; agents use its MCP tools (see .kiro/settings/mcp.json)
  reference_dsn: ""        # fallback for human-run ttIsql; agents never touch production
  version: ""              # affects which dictionary views exist; see tools/extract-inventory.sql
  schemas: []              # e.g. [APP, REF]
  logic_frozen: true       # owner has declared TimesTen logic frozen for the migration;
                           # drift check runs once before cutover instead of weekly (docs/01)

# Application repositories containing business logic and/or SQL against TimesTen (docs/01 §7).
# Spring Boot services calling TimesTen procs are inventory units too (java-service).
app_repositories: []
#  - path: ../order-gateway
#    language: java
#    framework: spring-boot   # scan: CallableStatement, SimpleJdbcCall, "{call", @Procedure,
#                             #       JdbcTemplate, native @Query, MyBatis mappers
#  - path: ../settlement-batch
#    language: c

extraction_cadence: weekly  # drift control — see docs/01
