# Node-level OpenTelemetry Collector DaemonSet (X-001).
#
# This is the scoped collector deployment. It PREFLIGHTS node-log access and FAILS LOUDLY
# (A-006 tripwire) when the host log path is unreadable, collects ONLY opted-in test workloads
# (X-003), enriches identity and test.run_id (INV-META-1), and sends schemaVersion-1 records to
# the ingest service (X-008). Host access is read-only and non-privileged: this template must
# never add privileged mode, hostNetwork, or hostPID.
#
# Fallback: for log sources unavailable from the node (a private file, or a cluster that denies
# host-log access) the per-pod sidecar collector path remains the explicit documented fallback
# (A-006). Do NOT broaden host access here to reach those sources.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    app.kubernetes.io/name: log-debug-context-collector
    app.kubernetes.io/component: collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: log-debug-context-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-debug-context-collector
        app.kubernetes.io/component: collector
    spec:
      hostNetwork: false
      hostPID: false
      serviceAccountName: {{ .Release.Name }}-collector
      initContainers:
        # A-006 tripwire: verify node-log access before the collector runs. A denied or absent
        # host log path fails this container, which blocks the DaemonSet pod and rolls out nothing.
        - name: node-log-preflight
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              if [ ! -d /var/log/pods ]; then
                echo "PREFLIGHT_FAILED: node-log path /var/log/pods is absent" >&2
                exit 1
              fi
              if ! find /var/log/pods -name '*.log' -readable -print -quit | grep -q .; then
                echo "PREFLIGHT_FAILED: node-log access denied or no readable pod logs under /var/log/pods" >&2
                exit 1
              fi
              echo "preflight: node-log access OK"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
      containers:
        - name: otel-collector
          # Immutable image, pinned by collector/contract-image.lock. Changing it is an owner decision.
          image: "otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc"
          args:
            - --config=/etc/otelcol/config.yaml
          env:
            - name: INGEST_ENDPOINT
              value: "http://{{ .Release.Name }}-ingest:8080/ingest"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
          volumeMounts:
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: varlogpods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: otel-config
          configMap:
            name: {{ .Release.Name }}-collector
---
# In-cluster collector pipeline. It reads real pod stdout/stderr from the node, enriches identity
# and labels via the Kubernetes API, applies the SAME opt-in filter and schemaVersion-1 mapping as
# collector/otel-collector.yaml, and exports only to the ingest service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-collector
  labels:
    app.kubernetes.io/name: log-debug-context-collector
    app.kubernetes.io/component: collector
data:
  config.yaml: |
    receivers:
      filelog:
        include: ["/var/log/pods/*/*/*.log"]
        include_file_name: false
        include_file_path: true
        start_at: beginning
        operators:
          - type: regex_parser
            regex: '^.*/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[0-9a-f-]+)/(?P<container>[^/]+)/.*\.log$'
          - type: json_parser
    processors:
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.pod.labels
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
      filter:
        logs:
          log_record:
            - 'resource.attributes["k8s.pod.labels.debug.logs/enabled"] != "true"'
            - 'resource.attributes["k8s.pod.labels.environment"] != "test"'
      transform:
        log_statements:
          - context: log
            statements:
              - 'set(body, attributes["message"])'
              - 'set(attributes["schemaVersion"], 1)'
              - 'set(attributes["namespace"], resource.attributes["k8s.namespace.name"])'
              - 'set(attributes["pod"], resource.attributes["k8s.pod.name"])'
              - 'set(attributes["container"], resource.attributes["k8s.container.name"])'
              - 'set(attributes["workload"], resource.attributes["k8s.deployment.name"])'
              - 'set(attributes["environment"], resource.attributes["k8s.pod.labels.environment"])'
              - 'set(attributes["optIn"], true)'
              - 'set(attributes["test.run_id"], attributes["attributes"]["test.run_id"])'
    exporters:
      otlphttp:
        endpoint: ${env:INGEST_ENDPOINT}
        encoding: json
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        logs:
          receivers: [filelog]
          processors: [k8sattributes, filter, transform]
          exporters: [otlphttp]
