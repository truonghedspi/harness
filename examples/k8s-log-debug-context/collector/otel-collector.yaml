# OpenTelemetry Collector contract pipeline — hermetic (non-cluster) execution.
#
# This is the real collector config executed by CollectorContractBootstrap against the pinned
# contrib image in collector/contract-image.lock. It reads the post-enrichment JSONL fixture at
# /fixtures/pod-logs.json, admits only the opted-in test scope (X-003), maps each eligible event
# to the schemaVersion-1 serialized ingress shape (X-008), and exports it to the ingest endpoint
# passed as INGEST_ENDPOINT. There is exactly one exporter: records never leave through any path
# other than ingest.
receivers:
  filelog:
    include: ["/fixtures/pod-logs.json"]
    include_file_name: false
    include_file_path: true
    start_at: beginning
    operators:
      - type: json_parser

processors:
  # Opt-in admission: keep only the conjunction of debug.logs/enabled == "true" and
  # environment == "test". Every other row is discarded before export (INV-SCOPE-1).
  filter:
    logs:
      log_record:
        - 'attributes["kubernetes.labels.debug.logs/enabled"] == "true"'
        - 'attributes["kubernetes.labels.environment"] == "test"'

  # Enrichment and schemaVersion-1 serialization: identity fields and test.run_id must survive
  # the boundary without renaming (INV-META-1); each admitted event is one schemaVersion-1 object.
  transform:
    log_statements:
      - context: log
        statements:
          - 'set(attributes["schemaVersion"], 1)'
          - 'set(attributes["observedAt"], attributes["observedAt"])'
          - 'set(attributes["source"], attributes["source"])'
          - 'set(attributes["namespace"], attributes["kubernetes.namespace"])'
          - 'set(attributes["pod"], attributes["kubernetes.pod"])'
          - 'set(attributes["container"], attributes["kubernetes.container"])'
          - 'set(attributes["workload"], attributes["kubernetes.workload"])'
          - 'set(attributes["environment"], attributes["kubernetes.labels.environment"])'
          - 'set(attributes["optIn"], true)'
          - 'set(attributes["test.run_id"], attributes["attributes.test.run_id"])'

exporters:
  # The only egress. No debug, logging, or file exporter may be added here.
  otlphttp:
    endpoint: ${env:INGEST_ENDPOINT}
    encoding: json

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [filelog]
      processors: [filter, transform]
      exporters: [otlphttp]
