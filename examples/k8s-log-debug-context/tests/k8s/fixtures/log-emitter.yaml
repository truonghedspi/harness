apiVersion: apps/v1
kind: Deployment
metadata:
  name: journey-log-emitter
  labels:
    app.kubernetes.io/name: journey-log-emitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: journey-log-emitter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: journey-log-emitter
        debug.logs/enabled: "true"
        environment: test
    spec:
      restartPolicy: Always
      containers:
        - name: emitter
          image: busybox:1.36.1
          command: ["sh", "-ceu"]
          args:
            - |
              emit() { printf '%s\n' "$1" | tee -a /var/log/journey/emitter.log; }
              observed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              emit "{\"observedAt\":\"$observed_at\",\"message\":\"__TARGET_MARKER__ password=__MESSAGE_SECRET__\",\"attributes\":{\"test.run_id\":\"__TARGET_RUN_ID__\",\"api_key\":\"__ATTRIBUTE_SECRET__\"}}"
              emit "{\"observedAt\":\"$observed_at\",\"message\":\"__DECOY_MARKER__\",\"attributes\":{\"test.run_id\":\"__DECOY_RUN_ID__\"}}"
              i=1
              while [ "$i" -le 220 ]; do
                emit "{\"observedAt\":\"$observed_at\",\"message\":\"__TARGET_MARKER__ budget-$i\",\"attributes\":{\"test.run_id\":\"__TARGET_RUN_ID__\"}}"
                i=$((i + 1))
              done
              sleep 3600
          volumeMounts:
            - name: journey-log
              mountPath: /var/log/journey
        - name: log-collector-sidecar
          image: "otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc"
          args: ["--config=/etc/otelcol/config.yaml"]
          env:
            - name: INGEST_ENDPOINT
              value: "http://log-debug-context-ingest:8080/ingest"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          volumeMounts:
            - name: journey-log
              mountPath: /var/log/journey
              readOnly: true
            - name: journey-sidecar-config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: journey-log
          emptyDir: {}
        - name: journey-sidecar-config
          configMap:
            name: log-debug-context-journey-sidecar
